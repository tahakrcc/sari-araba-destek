<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- Sosyal paylaşım görseli kaynağı (1200x630). Headless Chrome ile
     assets/og-cover.png olarak render edilir; sitede yayınlanmaz. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FFD21C;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: #14141a;
    position: relative;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(20,20,26,0.05) 1px, transparent 1px);
    background-size: 100% 40px;
  }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; gap: 56px; padding: 0 74px; }
  .left { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
  .brand { background: #14141a; padding: 12px 18px; border-radius: 10px; }
  .brand img { height: 42px; display: block; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase; color: #7a6410; }
  h1 { font-family: Anton, sans-serif; font-weight: 400; text-transform: uppercase; line-height: 0.9; font-size: 92px; letter-spacing: -0.005em; }
  h1 em { font-style: normal; color: #17516f; }
  p { font-size: 24px; line-height: 1.4; color: #453c1c; max-width: 20ch; }
  .foot { display: flex; align-items: center; gap: 14px; margin-top: 6px; font-family: "IBM Plex Mono", monospace; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: #7a6410; }
  .foot .plate { display: inline-flex; border: 2px solid #14141a; border-radius: 4px; overflow: hidden; background: #fff; }
  .foot .plate .eu { background: #17516f; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5px 7px; font-family: "IBM Plex Mono", monospace; font-size: 9px; font-weight: 600; line-height: 1.1; }
  .foot .plate .no { padding: 4px 12px; font-family: Anton, sans-serif; font-size: 22px; letter-spacing: 0.14em; display: flex; align-items: center; }

  /* Sağda: uygulamanın ilan kartı */
  .card { width: 372px; background: #fff; border: 1px solid #DCDCDC; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(20,20,26,0.45); flex: none; }
  .shot { position: relative; height: 210px; background: #fff; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 14px; top: 14px; background: #FFD21C; color: #1D1D1D; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; padding: 6px 9px; border-radius: 5px; }
  .fav { position: absolute; right: 14px; top: 14px; width: 42px; height: 42px; border-radius: 999px; background: rgba(255,255,255,0.9); display: grid; place-items: center; }
  .fav svg { width: 21px; height: 21px; }
  .body { padding: 18px 20px 20px; }
  .title { font-size: 21px; font-weight: 600; color: #303030; }
  .pro { display: inline-block; margin-top: 8px; background: #F0F8FF; border: 1px solid #B0E0E6; color: #4682B4; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; padding: 4px 8px; border-radius: 5px; }
  .price { margin-top: 10px; color: #23688F; font-size: 27px; font-weight: 700; letter-spacing: -0.01em; }
  .facts { margin-top: 9px; font-size: 16px; font-weight: 600; color: #6B6B6B; }
  .facts i { color: #bdbdbd; font-style: normal; padding: 0 8px; }
  .cfoot { margin-top: 14px; padding-top: 12px; border-top: 1px solid #ECECEC; display: flex; justify-content: space-between; font-size: 14px; color: #999; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <span class="brand"><img src="assets/logo.png" alt="Sarı Araba"></span>
      <span class="tag">İlan No: 001 · Sıfır kilometre</span>
      <h1>Sıfırdan<br>galeri<br><em>patronuna.</em></h1>
      <p>Gerçek oyuncuların ilan verdiği canlı ikinci el araç piyasası.</p>
      <div class="foot">
        <span class="plate"><span class="eu"><span>★</span><span>TR</span></span><span class="no">01 TK 001</span></span>
        <span>iOS &amp; Android · Ücretsiz</span>
      </div>
    </div>
    <div class="card">
      <div class="shot">
        <img src="assets/models/photos/corvette-c7.jpg" alt="">
        <span class="badge">ÖNE ÇIKAN</span>
        <span class="fav"><svg viewBox="0 0 24 24" fill="none" stroke="#1D1D1D" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
      </div>
      <div class="body">
        <div class="title">Chevrol Corvet C7</div>
        <span class="pro">PRO GALERİ</span>
        <div class="price">18.000.000 ₺</div>
        <div class="facts">2017 <i>•</i> 41.500 km <i>•</i> Otomatik</div>
        <div class="cfoot"><span>İstanbul</span><span>3 dk önce</span></div>
      </div>
    </div>
  </div>
</body>
</html>
